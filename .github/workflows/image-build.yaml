name: image-publish
run-name: Build and publish images for ${{ github.ref_name }} @ ${{ github.sha }}

on:
  push:
    branches:
      - main
    tags:
      - '7.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set variables
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          BRANCH_NAME=${GITHUB_REF}
          echo "BRANCH_NAME=${BRANCH_NAME##*/}" >> $GITHUB_ENV
      - name: Checkout
        uses: actions/checkout@v7
        #with:
        #  token: ${{ secrets.CHE_INCUBATOR_BOT_TOKEN }}
      - name: Login to quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Docker Build and Push
        env:
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          SHORT_SHA1=$(git rev-parse --short=7 HEAD)
          if [[ ${BRANCH_NAME} == main ]]; then
            docker build -f build/dockerfiles/Dockerfile --push -t quay.io/che-incubator/che-idea-dev-server:next .
          elif [[ ${BRANCH_NAME} =~ ^7\.[0-9]+\.[0-9]+$ ]]; then
            docker build -f build/dockerfiles/Dockerfile --push -t quay.io/che-incubator/che-idea-dev-server:${BRANCH_NAME} -t quay.io/che-incubator/che-idea-dev-server:latest .
          fi
