name: Publish Image PR check

on:
  workflow_run:
    workflows: ["Pull Request Check"]
    types:
      - completed

jobs:
  publish-image:
    name: publish image from the pull request
    runs-on: ubuntu-latest
    steps:
      - name: Login to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_PULL_REQUESTS_USERNAME }}
          password: ${{ secrets.QUAY_PULL_REQUESTS_PASSWORD }}

      - name: Download Pull Request Number artifact
        uses: actions/download-artifact@v7
        with:
          name: pull-request-number
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Grab Pull Request number
        run: |
          pr_number=$(cat "PR_NUMBER")
          echo "Pull Request: ${pr_number}"
          if ! [[ "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "Wrong Pull Request number"
            exit 1
          fi
          echo "_PR_NUMBER=$pr_number" >> $GITHUB_ENV

      - name: Cleanup docker images
        run: docker system prune -af

      - name: Download image artifact
        uses: actions/download-artifact@v7
        with:
          name: che-idea-dev-server
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Load image
        run: docker load -i che-idea-dev-server.tgz

      - name: Push image
        run: |
          export IMAGE=quay.io/che-incubator-pull-requests/che-idea-dev-server:pr-${{ env._PR_NUMBER }}
          docker tag che-idea-dev-server:pr ${IMAGE}
          docker push ${IMAGE}
          echo "_IMAGE=${IMAGE}" >> $GITHUB_ENV

      - name: 'Comment PR'
        uses: actions/github-script@v8
        with:
          script: |
            const { repo: { owner, repo } } = context;
            await github.rest.issues.createComment({
              issue_number: process.env._PR_NUMBER,
              owner,
              repo,
              body: `Pull Request image published ✨\n\nImage: [${process.env._IMAGE}](https://${process.env._IMAGE})`
            })
